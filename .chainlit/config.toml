[project]

# By default, telemetry is enabled to help improve the application.
# No personal data or sensitive information is ever collected.
# Set to 'false' to disable all outbound telemetry and data sharing.
enable_telemetry = false

# List of environment variables to be provided by each user to use the app.
user_env = []

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 3600

# Duration (in seconds) of the user session expiry
user_session_timeout = 1296000  # 15 days

# Enable third parties caching (e.g., LangChain cache)
cache = false

# Authorized origins
allow_origins = ["*"]

[features]
# Process and display HTML in messages. This can be a security risk (see https://stackoverflow.com/questions/19603097/why-is-it-dangerous-to-render-user-generated-html-or-javascript)
unsafe_allow_html = false

# Process and display mathematical expressions. This can clash with "$" characters in messages.
latex = false

# Automatically tag threads with the current chat profile (if a chat profile is used)
auto_tag_thread = true

# Allow users to edit their own messages
# an edit removed later turns from the screen but not from the model's
# history, so text a reader edited out kept being sent with every turn 
edit_message = true

# Authorize users to spontaneously upload files with messages
[features.spontaneous_file_upload]
    enabled = true
    # Define accepted file types using MIME types
    # Examples:
    # 1. For specific file types:
    #    accept = ["image/jpeg", "image/png", "application/pdf"]
    # 2. For all files of certain type:
    #    accept = ["image/*", "audio/*", "video/*"]
    # 3. For specific file extensions:
    #    accept = { "application/octet-stream" = [".xyz", ".pdb"] }
    # Note: Using "*/*" is not recommended as it may cause browser warnings
    # Spreadsheets only: the formats Breedbase accepts for trial uploads (see bin/upload/reader.py)
    # this below file extensions are commonly used in the Breedbase user file upload
    #[features.spontaneous_file_upload]
    accept = { "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" = [".xlsx"], 
                "application/vnd.ms-excel" = [".xls"], "application/vnd.oasis.opendocument.spreadsheet" = [".ods"], 
                "text/csv" = [".csv"], 
                "text/tab-separated-values" = [".tsv"], 
                "text/plain" = [".txt", ".ssv"] 
            }
    max_files = 1
    max_size_mb = 20

[features.audio]
    # Sample rate of the audio
    sample_rate = 24000

#these MCP features needs to be discussed before we add them
[features.mcp]
    # Enable Model Context Protocol (MCP) features
    # enabled = false

[features.mcp.sse]
    #enabled = true

[features.mcp.streamable-http]
    #enabled = true

[features.mcp.stdio]
    enabled = true
    # Only the executables in the allow list can be used for MCP stdio server.
    # Only need the base name of the executable, e.g. "npx", not "/usr/bin/npx".
    # Please don't comment this line for now, we need it to parse the executable name.
    allowed_executables = [ "npx", "uvx" ]

[UI]
# Name of the assistant.
name = "Breedbase ChatBot"

# Always English, whatever the browser's language: the login labels, the start page and the disclaimer (watermark) are
# written in .chainlit/translations/en-US.json. Without this, a German or French browser gets Chainlit's own texts.
language = "en-US"

# default_theme = "dark"

# layout = "wide"

# Description of the assistant. This is used for HTML tags.
# description = ""

# Chain of Thought (CoT) display mode. Can be "hidden", "tool_call" or "full".
cot = "hidden"

# Specify a CSS file that can be used to customize the user interface.
# The CSS file can be served from the public directory or via an external link.
# custom_css = "/public/test.css"


# Specify a JavaScript file that can be used to customize the user interface.
# The JavaScript file can be served from the public directory.
# Guest access on the login page and the guest-limit login flow (see public/login.js)
custom_js = "/public/login.js"


